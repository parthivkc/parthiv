<!DOCTYPE html>
<html>
<head>
    <title>Events</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Upcoming Events</h1>
        <p>Explore our college events</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="events.html">Event</a>
        <a href="registration.html">Register</a>
        <a href="contact.html">Contact</a>
    </nav>

    <div class="content">
        <h2>Student Registration</h2>

        <form onsubmit="registerstudent(event)">
            <label>Name:</label>
            <input type="text" id="name" required>

            <label>E-mail:</label>
            <input type="email" id="email" required>

            <label>Department:</label>
            <input type="text" id="department" required>

            <label>Select Event:</label>
            <select id="event" required>
                <option value="">Select event</option>
                <option value="Web Development Workshop">
                    Web Development Workshop
                </option>
                <option value="Quiz Competition">
                    Quiz Competition
                </option>
                <option value="Coding Competition">
                    Coding Competition
                </option>
            </select>

            <button type="submit">Register</button>
        </form>

        <p id="message"></p>
    </div>

    <script>
        function registerstudent(event) {
            event.preventDefault();

            let name = document.getElementById("name").value;
            let selectedEvent = document.getElementById("event").value;

            document.getElementById("message").innerHTML =
                "Successfully registered!<br>" +
                "Welcome " + name + "<br>" +
                "Event: " + selectedEvent;

            document.getElementById("message").style.display = "block";
        }
    </script>
</body>
</html>
